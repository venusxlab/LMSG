<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Mi primera página web</title>
        <!--Esto es un comentario-->
        <link rel="stylesheet" href="styles.css">

    </head>
    <body>
        <!--Le ponemos un id para hacer referencia en la hoja de estilos más tarde-->
        <h1 id="titulo-principal">Mi primera página web</h1>
        <!--Creacion del primer div-->
        <div id="caja-uno" class="caja">
            <h2 id="titulo-uno" class="titulo">Mi primera imagen</h2>
            <img id="imagen-uno" class="imagen" src="assets/img1.jpg" alt="Primera Imagen JPG">
            <p id="texto-uno" class="texto">Este es el texto asociado a la imagen 1.</p>
            <p id="descripcion-uno" class="descripcion">Descripcion de la imagen 1.</p>
        </div>
        <div id="caja-dos" class="caja">
            <h2 id="titulo-dos" class="titulo">Mi segunda imagen</h2>
            <img id="imagen-dos" class="imagen" src="assets/img2.jpg" alt="Segunda Imagen Loro">
            <p id="texto-dos" class="texto">Este es el texto asociado a la imagen 2.</p>
            <p id="descripcion-dos" class="descripcion">Descripcion de la imagen 2.</p>
        </div>
    </body>
</html>
