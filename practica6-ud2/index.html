<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale1.0">
        <title>Media Queries</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <header>
            <h1>Primera pagina con media Queries.</h1>
        </header>
        <div class="container">
            <section class="grid">
                <img src="imagen1.png" alt="imagen de ejemplo">
                <p>
                    Esta página cambia su diseño según el tamaño de la pantalla.
                    En un móvil, la imagen y el texto aparecen uno debajo del otro.
                    En una tablet o PC se colocan uno al lado del otro.
                    También cambiaremos algunos colores en función del Media Querie.
                </p>
            </section>
        </div>
    </body>
</html>
